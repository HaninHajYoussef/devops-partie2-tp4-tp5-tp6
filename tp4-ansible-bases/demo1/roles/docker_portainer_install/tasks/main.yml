---
- name: Installer Docker Engine, Docker Compose v2 et le SDK Python
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - python3-docker
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Démarrer Docker et l'activer au boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ajouter l'utilisateur au groupe docker
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true

- name: Créer le volume de données de Portainer
  community.docker.docker_volume:
    name: portainer_data

- name: Lancer le conteneur Portainer CE
  community.docker.docker_container:
    name: portainer
    image: "{{ portainer_image }}"
    state: started
    restart_policy: always
    ports:
      - "8000:8000"
      - "{{ portainer_https_port }}:9443"
      - "{{ portainer_http_port }}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
